name: Unittests

# Runs the suite the way the rest of the org does: inside a rez resolve on
# the studio runners, where nxt_editor's own requires supply everything the
# tests need. Nothing is cloned from another repo, so nothing needs a token.
#
# This replaces the workflow inherited from nxt-dev, which pip installed
# nxt-core straight from GitHub. That worked only while these repos were
# public.
on:
  workflow_dispatch:
  pull_request:
    branches-ignore: [ release ]
  push:
    branches-ignore: [ release ]

jobs:
  test-package:
    secrets: inherit
    uses: squarebit-studios/sbgitworkflows/.github/workflows/package_run_tests.yml@main
    with:
      package-name: "nxt_editor"
      tests-path: "nxt_editor/test"
      # 3.13, for Maya 2027, belongs here too and the code is verified on
      # it: both suites pass under Maya 2027's own interpreter. It cannot
      # run here yet, because the studio's pytest and pytest_cov rez
      # packages are built for python-3.10|3.11 only, so the resolve fails
      # before a test runs. Add 3.13 the moment those exist.
      python_versions: '[ "3.11" ]'
      # macOS only. On the windows runner rez-env exits immediately with no
      # resolve output, and reports its package cache directory missing, so
      # that machine is not set up to resolve these yet.
      runners: '[ [ "self-hosted", "macOS" ] ]'
