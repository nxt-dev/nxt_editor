name: Unittests

on:
  workflow_dispatch:
    branches-ignore: [release]
  workflow_call:
  pull_request:
    branches-ignore: [release]
  push:
    branches-ignore: [release]

jobs:
  test-python:
    secrets: inherit
    # Our fork, not nxt-dev/nxt@dev. Upstream's matrix moved to a python
    # the package declares it does not support, so every job died at the
    # install step and fail-fast cancelled the rest, which is why these
    # tests have not actually run in a while.
    uses: squarebit-studios/nxt/.github/workflows/unittests.yml@sb_dev
    with:
      QT_DEPENDENCIES: true
