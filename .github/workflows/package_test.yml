name: Package test

# Fails a pull request that has not bumped nxt_editor/version.json. package.py reads
# its version from that file and rez tags the release from it, so an unbumped
# version would collide with a package that already exists.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - 'dev'
      - 'release'

jobs:
  test-package-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version changed
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            version:
              - nxt_editor/version.json

      - name: Invalid version
        if: steps.filter.outputs.version == 'false'
        run: |
          echo "Package version already exists. Please bump nxt_editor/version.json."
          exit 1

      - name: Valid version
        if: steps.filter.outputs.version == 'true'
        run: echo "Package version changed."
