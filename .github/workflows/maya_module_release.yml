# Build nxt and nxt_editor into per-host packages and publish them.
#
# Upstream's release.yml publishes to PyPI, which is the right shape for a
# python package and the wrong one for Maya: an artist needs a folder with a
# .mod file in it, not a pip install. This produces that instead.
#
# The assembly itself is build/make_maya_plugin.nxt, which already knows how to
# do it - it copies nxt_editor/integration/maya as the module template, drops
# both packages under scripts/, and stamps the version into nxt.mod. This
# workflow's job is to give that graph the two source trees and to publish what
# it produces.
#
# Runs against OUR forks rather than nxt-dev's, so a change we make to either
# is in the module we ship.
name: Host packages

on:
  push:
    branches: [release]
  workflow_dispatch:

jobs:
  build:
    # Pinned to this fork. Upstream releases through PyPI and should not start
    # publishing Maya modules because a fork added a workflow.
    if: github.repository == 'squarebit-studios/nxt_editor'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout nxt_editor
        uses: actions/checkout@v4
        with:
          path: nxt_editor

      # The packaging graph expects nxt to sit BESIDE nxt_editor - it reaches
      # for ../nxt/nxt - which actions/checkout cannot do, since it refuses to
      # write outside the workspace. Cloning by hand can.
      - name: Checkout nxt beside it
        run: |
          git clone --depth 1 --branch release \
            "https://x-access-token:${{ secrets.GH_PAT }}@github.com/squarebit-studios/nxt.git" \
            nxt

      - name: Install Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install nxt
        run: |
          python -m pip install --upgrade pip
          pip install ./nxt
          pip install ./nxt_editor

      # src=local uses the checkouts above instead of cloning from nxt-dev over
      # SSH, which is what the graph does by default and which has no key here.
      - name: Build the Maya module
        working-directory: nxt_editor
        run: |
          python -m nxt.cli -vv exec build/make_maya_plugin.nxt \
            -s /make_module_folder \
            -p /.src local

      - name: Build the Unreal plugin
        working-directory: nxt_editor
        run: |
          python -m nxt.cli -vv exec build/make_unreal_plugin.nxt \
            -s /make_plugin

      # Blender has an integration but no packaging graph, so it is assembled
      # here: the addon plus both packages beside it, which is all a Blender
      # addon folder is. Kept in the workflow rather than invented as a graph,
      # so if a real one is written upstream this step simply goes away.
      - name: Build the Blender addon
        working-directory: nxt_editor
        run: |
          set -e
          ADDON=build/nxt_blender
          rm -rf "$ADDON" && mkdir -p "$ADDON"
          cp nxt_editor/integration/blender/nxt_blender.py "$ADDON/__init__.py"
          cp nxt_editor/integration/blender/README.md "$ADDON/" || true
          cp -r nxt_editor "$ADDON/nxt_editor"
          cp -r ../nxt/nxt "$ADDON/nxt"
          rm -rf "$ADDON"/*/__pycache__ "$ADDON"/*/*/__pycache__ || true
          echo "blender addon contents:" && ls "$ADDON"

      - name: Read the version
        id: version
        working-directory: nxt_editor
        run: |
          VERSION=$(python -c "from nxt_editor.integration import plugin_version; print(plugin_version())")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building host packages at $VERSION"

      # Fails loudly rather than publishing an empty archive: a graph that runs
      # green but writes nothing is the failure worth catching here.
      - name: Check the Maya module was built
        working-directory: nxt_editor
        run: |
          test -f build/nxt_maya/nxt.mod || { echo "no nxt.mod in build/nxt_maya"; exit 1; }
          test -d build/nxt_maya/scripts/nxt || { echo "nxt core missing"; exit 1; }
          test -d build/nxt_maya/scripts/nxt_editor || { echo "nxt_editor missing"; exit 1; }
          echo "module contents:"
          ls build/nxt_maya

      # One archive per host, named so the store can tell them apart: the
      # deploy picks each out of the release by matching the host in the name.
      # One archive for every host. They share nxt and the editor - about
      # 76 MB of identical bytes - so three separate downloads would ship that
      # three times to someone installing one of them. The guide covers which
      # folder to use where.
      - name: Zip them together
        working-directory: nxt_editor/build
        run: |
          set -e
          V="${{ steps.version.outputs.version }}"
          STAGE="nxt_$V"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          for host in maya unreal blender; do
            if [ -d "nxt_$host" ]; then
              mv "nxt_$host" "$STAGE/$host"
              echo "included $host"
            else
              echo "no nxt_$host built"
            fi
          done
          zip -qr "nxt_${V}.zip" "$STAGE"
          echo "packaged nxt_${V}.zip"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hosts_v${{ steps.version.outputs.version }}
          name: nxt for Maya, Unreal and Blender ${{ steps.version.outputs.version }}
          files: nxt_editor/build/nxt_${{ steps.version.outputs.version }}.zip
          body: |
            nxt and nxt_editor for every host, in one archive. Each folder
            inside is ready to install; use the one for your host.

            - **maya/** - point `MAYA_MODULE_PATH` at it, or drop it into your
              Maya modules directory.
            - **unreal/** - drop it into your project's `Plugins` folder.
            - **blender/** - install it as an addon.

            Built from squarebit-studios/nxt@release and
            squarebit-studios/nxt_editor@release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
