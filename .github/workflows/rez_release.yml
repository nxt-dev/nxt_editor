name: Rez Release

# Releases nxt_editor into the studio rez packages. Only release publishes;
# package.py pins release_branches to match, so a release from anywhere else is
# refused by rez itself as well as by this trigger.
#
# Calls the shared workflow, the same as core and touchpose. This was inlined
# while the repo was public, because a public repository cannot call a private
# reusable workflow.
on:
  push:
    branches:
      - 'release'
  workflow_dispatch:

jobs:
  rez-release:
    secrets: inherit
    uses: squarebit-studios/sbgitworkflows/.github/workflows/rez_release.yml@main
    with:
      package-name: "nxt_editor"
      # build/ holds this repo's own build graphs, and rez would empty it.
      build-directory: ".rez_build"
