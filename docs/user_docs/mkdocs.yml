site_name: NXT User Docs
site_description: Node eXecution Tree, A python layering and sequential execution tool for Animation and VFX
copyright: 2020 NXT authors

nav:
    - Home: index.md
    - What's New: whats_new.md
    - Getting Started:
        - Installation: install.md
        - Concepts: concepts.md
        - Tutorials: tutorials.md
    - Reference:
        - Using the Editor: editor.md
        - Graphs and Nodes: graphs.md
        - Layers and References: composition.md
        - File Format and Design: file_format.md
        - Hotkeys: hotkeys.md
        - Workflows: workflows.md
    - Extensions: extensions.md
    - API: api/index.html
    - About:
        - About: about.md
        - License: license.md
        - GitHub: https://github.com/nxt-dev/" target="_blank

not_in_nav: |
    /reference.md

markdown_extensions:
  - admonition

theme:
  # name: material
  name: mkdocs
  highlightjs: true
  hljs_style: tomorrow-night
  hljs_languages:
      - yaml
      - json
      - python
  custom_dir: custom_theme/

# extra_css: [extra.css]

